<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCBN</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#111;--gray:#555;--lgray:#bbb;--border:#ccc;
  --bg:#f4f1ec;--red:#c0392b;
  --serif:Georgia,Batang,serif;
  --sans:'Helvetica Neue','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
}
body{background:var(--bg);color:var(--black);font-family:var(--serif);font-size:16px;line-height:1.7}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline}
#topbar{background:var(--black);color:#ccc;font-family:var(--sans);font-size:12px;padding:5px 20px;display:flex;justify-content:space-between;align-items:center}
#topbar a{color:#ccc}
#topbar a:hover{color:#fff}
#masthead{text-align:center;padding:28px 20px 16px;border-bottom:3px double var(--black)}
.paper-name{font-family:var(--serif);font-size:clamp(36px,6vw,72px);font-weight:bold;letter-spacing:-1px;line-height:1.1}
.paper-sub{font-family:var(--sans);font-size:12px;color:var(--gray);margin-top:6px;letter-spacing:.15em;text-transform:uppercase}
.paper-motto{font-style:italic;font-size:13px;color:var(--gray);margin-top:4px}
.edition-info{font-family:var(--sans);font-size:11px;color:var(--lgray);margin-top:8px;border-top:1px solid var(--border);padding-top:6px}
#mainnav{background:var(--black);display:flex;justify-content:center;flex-wrap:wrap}
#mainnav a{color:#eee;font-family:var(--sans);font-size:13px;font-weight:600;padding:9px 16px;border-right:1px solid #333}
#mainnav a:first-child{border-left:1px solid #333}
#mainnav a:hover{background:#333;text-decoration:none}
#mainnav a.active{background:var(--red);color:#fff}
#breaking{background:var(--red);color:#fff;font-family:var(--sans);font-size:13px;padding:7px 16px;display:flex;align-items:center;gap:12px}
.brk-label{font-weight:700;font-size:11px;background:#fff;color:var(--red);padding:2px 7px;flex-shrink:0}
#wrapper{max-width:1100px;margin:0 auto;padding:0 16px}
.sec-title{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;border-bottom:2px solid var(--black);padding-bottom:4px;margin:28px 0 16px}
#hero{display:grid;grid-template-columns:2fr 1fr;gap:24px;padding:24px 0 20px;border-bottom:1px solid var(--border)}
.hero-main h1{font-size:clamp(22px,3.5vw,36px);line-height:1.2;font-weight:bold;margin-bottom:10px}
.byline{font-family:var(--sans);font-size:12px;color:var(--gray);margin-bottom:10px}
.summary{font-size:15px;line-height:1.65;color:#333}
.read-more{display:inline-block;margin-top:12px;font-family:var(--sans);font-size:12px;font-weight:600;color:var(--red);border-bottom:1px solid var(--red)}
.hero-side{border-left:1px solid var(--border);padding-left:20px}
.side-item{padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--border)}
.side-item:last-child{border-bottom:none}
.side-item h3{font-size:15px;line-height:1.3;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:24px}
.card{border-bottom:1px solid var(--border);padding-bottom:16px}
.tag{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin-bottom:5px}
.card h2{font-size:17px;line-height:1.3;margin-bottom:6px;font-weight:bold}
.excerpt{font-size:13px;color:#444;line-height:1.55}
#art-view{display:none;max-width:720px;margin:32px auto;padding:0 16px}
#art-view .art-cat{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.15em;color:var(--red);margin-bottom:8px}
#art-view h1{font-size:clamp(24px,4vw,40px);line-height:1.2;margin-bottom:12px}
#art-view .art-byline{font-family:var(--sans);font-size:13px;color:var(--gray);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:8px 0;margin-bottom:24px}
#art-view .art-body{font-size:16px;line-height:1.85}
#art-view .art-body p{margin-bottom:18px}
.back-btn{display:inline-block;font-family:var(--sans);font-size:13px;color:var(--red);margin-bottom:20px;cursor:pointer}
#admin{display:none;max-width:760px;margin:40px auto;padding:32px;background:#fff;border:1px solid var(--border)}
#admin h2{font-family:var(--sans);font-size:18px;font-weight:700;margin-bottom:20px;padding-bottom:10px;border-bottom:2px solid var(--black)}
.frow{margin-bottom:16px}
.frow label{display:block;font-family:var(--sans);font-size:12px;font-weight:600;color:var(--gray);margin-bottom:5px}
.frow input,.frow textarea,.frow select{width:100%;border:1px solid var(--border);padding:9px 12px;font-family:var(--sans);font-size:14px;background:#fafafa;outline:none}
.frow input:focus,.frow textarea:focus,.frow select:focus{border-color:var(--black);background:#fff}
.frow textarea{min-height:200px;resize:vertical}
.btn{font-family:var(--sans);font-size:13px;font-weight:700;padding:10px 24px;cursor:pointer;border:none;background:var(--black);color:#fff}
.btn:hover{background:#444}
.btn-r{background:var(--red)}
.btn-r:hover{background:#a93226}
#amsg{font-family:var(--sans);font-size:13px;margin-top:12px;padding:10px 14px;display:none}
#amsg.ok{background:#e8f5e9;color:#2e7d32;border-left:3px solid #2e7d32}
#amsg.err{background:#fdecea;color:#c62828;border-left:3px solid #c62828}
#keydlg{display:none;max-width:380px;margin:80px auto;padding:32px;background:#fff;border:1px solid var(--border);text-align:center}
#keydlg h2{font-family:var(--sans);font-size:16px;font-weight:700;margin-bottom:16px}
#keydlg input{width:100%;border:1px solid var(--border);padding:10px 14px;font-size:15px;text-align:center;margin-bottom:12px}
.kerr{font-family:var(--sans);font-size:12px;color:var(--red);margin-top:8px;display:none}
footer{border-top:2px solid var(--black);margin-top:40px;padding:24px 16px;text-align:center;font-family:var(--sans);font-size:12px;color:var(--gray)}
footer strong{color:var(--black)}
@media(max-width:700px){
#hero{grid-template-columns:1fr}
.hero-side{border-left:none;border-top:1px solid var(--border);padding-left:0;padding-top:16px}
.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="topbar"><span id="tdate"></span><span><a id="aN">홈</a> &nbsp;|&nbsp; <a id="aP">기사 발행</a></span></div>
<header id="masthead">
  <div class="paper-name">MCBN</div>
  <div class="paper-sub">MCBN &nbsp;|&nbsp; 막고놈이 브로드캐스트 네트웍</div>
  <div class="paper-motto">"막고놈이, 세계의 세계"</div>
  <div class="edition-info" id="einfo"></div>
</header>
<nav id="mainnav">
  <a class="active" data-cat="all">전체</a>
  <a data-cat="공지">공지</a>
  <a data-cat="업데이트">업데이트</a>
  <a data-cat="이벤트">이벤트</a>
  <a data-cat="경제">경제</a>
  <a data-cat="사회">사회</a>
  <a data-cat="기타">기타</a>
</nav>
<div id="breaking" style="display:none"><span class="brk-label">속보</span><span id="brktext"></span></div>
<div id="wrapper">
  <div id="homepg">
    <div id="hero"></div>
    <div class="sec-title" id="lbl">최신 기사</div>
    <div class="grid" id="grid"></div>
  </div>
  <div id="art-view">
    <span class="back-btn" id="backBtn">목록으로 돌아가기</span>
    <div class="art-cat" id="avCat"></div>
    <h1 id="avTitle"></h1>
    <div class="art-byline" id="avByline"></div>
    <div class="art-body" id="avBody"></div>
  </div>
  <div id="keydlg">
    <h2>암호 키 입력</h2>
    <input type="password" id="keyIn" placeholder="암호 키를 입력하세요">
    <button class="btn" id="keyOk">확인</button>
    <div class="kerr" id="kerr">잘못된 키입니다.</div>
    <div style="margin-top:16px"><a id="keyBack" style="font-family:var(--sans);font-size:12px;color:var(--gray)">돌아가기</a></div>
  </div>
  <div id="admin">
    <h2>기사 발행 / 관리</h2>
    <div class="frow"><label>카테고리</label>
      <select id="fCat"><option>공지</option><option>업데이트</option><option>이벤트</option><option>경제</option><option>사회</option><option>기타</option></select></div>
    <div class="frow"><label>제목</label><input type="text" id="fTitle" placeholder="기사 제목"></div>
    <div class="frow"><label>기자명</label><input type="text" id="fAuthor" placeholder="예: super3"></div>
    <div class="frow"><label>요약</label><input type="text" id="fExcerpt" placeholder="요약을 하섽즈"></div>
    <div class="frow"><label>본문</label><textarea id="fBody" placeholder="본문을 입력하세요"></textarea></div>
    <div class="frow"><label>배너 표시</label>
      <select id="fBrk"><option value="0">아니오</option><option value="1">예</option></select></div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px">
      <button class="btn" id="pubBtn">발행하기</button>
      <button class="btn btn-r" id="cancelBtn">취소</button>
    </div>
    <div id="amsg"></div>
    <div class="sec-title" style="margin-top:36px">발행된 기사 목록</div>
    <div id="alist" style="font-family:var(--sans);font-size:13px"></div>
  </div>
</div>
<footer><strong>MCBN</strong> | 막고놈이 브로드캐스트 네트웍<br>
&copy; <span id="fyear"></span> MCBN. All rights reserved. &nbsp;|&nbsp; <a id="footerAdmin" style="color:#aaa">기사 발행</a></footer>

<script>
(function(){
var KEY = '와정말샍하네';
var SK  = 'srv_times_v2';
var cat = 'all';

function fDate(iso){
  var d=new Date(iso);
  return d.getFullYear()+'\ub144 '+(d.getMonth()+1)+'\uc6d4 '+d.getDate()+'\uc77c';
}
function fFull(iso){
  var d=new Date(iso);
  var w=['\uc77c','\uc6d4','\ud654','\uc218','\ubaa9','\uae08','\ud1a0'];
  var hh=('0'+d.getHours()).slice(-2);
  var mm=('0'+d.getMinutes()).slice(-2);
  return d.getFullYear()+'\ub144 '+(d.getMonth()+1)+'\uc6d4 '+d.getDate()+'\uc77c ('+w[d.getDay()]+') '+hh+':'+mm;
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function load(){
  try{return JSON.parse(localStorage.getItem(SK))||[];}catch(e){return [];}
}
function save(a){localStorage.setItem(SK,JSON.stringify(a));}

function showPage(p){
  var ids=['homepg','art-view','keydlg','admin'];
  for(var i=0;i<ids.length;i++) document.getElementById(ids[i]).style.display='none';
  if(p==='home'){document.getElementById('homepg').style.display='block';renderHome();}
  else if(p==='art'){document.getElementById('art-view').style.display='block';}
  else if(p==='key'){
    document.getElementById('keydlg').style.display='block';
    document.getElementById('keyIn').value='';
    document.getElementById('kerr').style.display='none';
  }
  else if(p==='admin'){document.getElementById('admin').style.display='block';renderList();}
}

function renderHome(){
  var all=load();
  var shown=cat==='all'?all:all.filter(function(a){return a.cat===cat;});
  shown.sort(function(a,b){return new Date(b.date)-new Date(a.date);});

  var hero=document.getElementById('hero');
  var grid=document.getElementById('grid');
  var lbl=document.getElementById('lbl');
  var brk=document.getElementById('breaking');

  if(!shown.length){
    hero.innerHTML='<p style="font-family:var(--sans);font-size:14px;color:var(--gray);padding:40px 0">\ubc1c\ud589\ub41c \uae30\uc0ac\uac00 \uc5c6\uc2b5\ub2c8\ub2e4.</p>';
    grid.innerHTML='';lbl.style.display='none';brk.style.display='none';return;
  }

  var m=shown[0];
  var sides=shown.slice(1,4);
  var rest=shown.slice(4);

  var sh=sides.map(function(s){
    return '<div class="side-item"><div class="byline">'+esc(s.cat)+' &middot; '+fDate(s.date)+'</div>'
      +'<h3><a href="#" data-id="'+s.id+'">'+esc(s.title)+'</a></h3></div>';
  }).join('');

  hero.innerHTML='<div class="hero-main">'
    +'<div class="byline">'+esc(m.cat)+' &middot; '+fDate(m.date)+' &middot; '+esc(m.author)+'</div>'
    +'<h1><a href="#" data-id="'+m.id+'">'+esc(m.title)+'</a></h1>'
    +'<p class="summary">'+esc(m.excerpt)+'</p>'
    +'<a class="read-more" href="#" data-id="'+m.id+'">\uae30\uc0ac \uc804\uccb4 \uc77d\uae30 &rarr;</a>'
    +'</div><div class="hero-side">'+sh+'</div>';

  grid.innerHTML=rest.map(function(a){
    return '<div class="card"><div class="tag">'+esc(a.cat)+'</div>'
      +'<h2><a href="#" data-id="'+a.id+'">'+esc(a.title)+'</a></h2>'
      +'<p class="excerpt">'+esc(a.excerpt)+'</p>'
      +'<div class="byline">'+esc(a.author)+' &middot; '+fDate(a.date)+'</div></div>';
  }).join('');

  lbl.style.display=rest.length?'block':'none';

  var brkArt=null;
  for(var i=0;i<all.length;i++){if(all[i].breaking){brkArt=all[i];break;}}
  if(brkArt){
    document.getElementById('brktext').textContent=brkArt.title;
    brk.style.display='flex';
  } else {
    brk.style.display='none';
  }
}

function openArt(id){
  var all=load();
  var a=null;
  for(var i=0;i<all.length;i++){if(all[i].id===id){a=all[i];break;}}
  if(!a)return;
  document.getElementById('avCat').textContent=a.cat;
  document.getElementById('avTitle').textContent=a.title;
  document.getElementById('avByline').textContent=a.author+' \u00b7 '+fFull(a.date);
  document.getElementById('avBody').innerHTML=a.body.split(/\n\n+/).map(function(p){
    return '<p>'+esc(p).replace(/\n/g,'<br>')+'</p>';
  }).join('');
  showPage('art');
  window.scrollTo(0,0);
}

function publish(){
  var title=document.getElementById('fTitle').value.trim();
  var body=document.getElementById('fBody').value.trim();
  if(!title||!body){showMsg('\uc81c\ubaa9\uacfc \ubcf8\ubb38\uc740 \ud544\uc218\uc785\ub2c8\ub2e4.','err');return;}
  var author=document.getElementById('fAuthor').value.trim()||'\ud3b8\uc9d1\uad6d';
  var excerpt=document.getElementById('fExcerpt').value.trim()||body.substring(0,60)+'...';
  var cat2=document.getElementById('fCat').value;
  var brk2=document.getElementById('fBrk').value==='1';
  var all=load();
  all.unshift({id:Date.now(),cat:cat2,title:title,author:author,excerpt:excerpt,body:body,date:new Date().toISOString(),breaking:brk2});
  save(all);
  document.getElementById('fTitle').value='';
  document.getElementById('fAuthor').value='';
  document.getElementById('fExcerpt').value='';
  document.getElementById('fBody').value='';
  document.getElementById('fBrk').value='0';
  showMsg('\uae30\uc0ac\uac00 \ubc1c\ud589\ub418\uc5c8\uc2b5\ub2c8\ub2e4!','ok');
  renderList();
}

function showMsg(txt,cls){
  var el=document.getElementById('amsg');
  el.textContent=txt;el.className=cls;el.style.display='block';
  setTimeout(function(){el.style.display='none';},3000);
}

function delArt(id){
  if(!confirm('\uc774 \uae30\uc0ac\ub97c \uc0ad\uc81c\ud558\uc2dc\uaca0\uc2b5\ub2c8\uae4c?'))return;
  save(load().filter(function(a){return a.id!==id;}));
  renderList();
}

function renderList(){
  var all=load();
  var el=document.getElementById('alist');
  if(!all.length){el.innerHTML='<p style="color:var(--gray)">\ubc1c\ud589\ub41c \uae30\uc0ac\uac00 \uc5c6\uc2b5\ub2c8\ub2e4.</p>';return;}
  el.innerHTML=all.map(function(a){
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">'
      +'<div><span style="color:var(--red);font-weight:700;margin-right:8px">['+esc(a.cat)+']</span>'
      +esc(a.title)
      +'<span style="color:var(--lgray);margin-left:8px">'+fDate(a.date)+'</span>'
      +(a.breaking?'<span style="color:var(--red);font-size:11px;margin-left:8px">\u25cf\uc18d\ubcf4</span>':'')
      +'</div>'
      +'<button data-del="'+a.id+'" style="font-family:var(--sans);font-size:12px;border:1px solid #ccc;padding:4px 10px;background:#fff;cursor:pointer;color:var(--red)">\uc0ad\uc81c</button>'
      +'</div>';
  }).join('');
  el.querySelectorAll('[data-del]').forEach(function(b){
    b.addEventListener('click',function(){delArt(Number(b.getAttribute('data-del')));});
  });
}

function initDemo(){
  if(load().length)return;
  var n=Date.now(),H=3600000;
  save([
    {id:n+1,cat:'공지',title:'MCBN 사이트 폐쇄 안내',author:'Server',
     excerpt:'안녕히계십시오.',
     body:'어그로고요 이거 더미데이터인데 이거 보인다는 뜻은 데이터가 다 날아갔거나..',
     date:new Date(n-H*2).toISOString(),breaking:true},
  ]);
}

// event delegation
document.addEventListener('click',function(e){
  var t=e.target;
  // article link
  var el=t;
  while(el&&el!==document){
    if(el.getAttribute&&el.getAttribute('data-id')){
      e.preventDefault();
      openArt(Number(el.getAttribute('data-id')));
      return;
    }
    el=el.parentNode;
  }
  // nav
  if(t.closest&&t.closest('#mainnav')){
    var na=t.closest('a');
    if(na&&na.getAttribute('data-cat')!==null){
      e.preventDefault();
      cat=na.getAttribute('data-cat');
      document.querySelectorAll('#mainnav a').forEach(function(a){a.classList.remove('active');});
      na.classList.add('active');
      showPage('home');
    }
  }
});

document.getElementById('aN').addEventListener('click',function(e){e.preventDefault();showPage('home');});
document.getElementById('aP').addEventListener('click',function(e){e.preventDefault();showPage('key');});
document.getElementById('footerAdmin').addEventListener('click',function(e){e.preventDefault();showPage('key');});
document.getElementById('backBtn').addEventListener('click',function(e){e.preventDefault();showPage('home');});
document.getElementById('keyBack').addEventListener('click',function(e){e.preventDefault();showPage('home');});
document.getElementById('keyOk').addEventListener('click',function(){
  var v=document.getElementById('keyIn').value.trim();
  if(v===KEY){showPage('admin');}
  else{document.getElementById('kerr').style.display='block';document.getElementById('keyIn').value='';}
});
document.getElementById('keyIn').addEventListener('keydown',function(e){
  if(e.key==='Enter')document.getElementById('keyOk').click();
});
document.getElementById('pubBtn').addEventListener('click',publish);
document.getElementById('cancelBtn').addEventListener('click',function(e){e.preventDefault();showPage('home');});

// init
var nd=new Date();
var dw=['\uc77c\uc694\uc77c','\uc6d4\uc694\uc77c','\ud654\uc694\uc77c','\uc218\uc694\uc77c','\ubaa9\uc694\uc77c','\uae08\uc694\uc77c','\ud1a0\uc694\uc77c'];
document.getElementById('tdate').textContent=nd.getFullYear()+'\ub144 '+(nd.getMonth()+1)+'\uc6d4 '+nd.getDate()+'\uc77c '+dw[nd.getDay()];
document.getElementById('einfo').textContent='\uc81c '+Math.floor((nd-new Date('2024-01-01'))/86400000)+'\ud638  |  MCBN';
document.getElementById('fyear').textContent=nd.getFullYear();
initDemo();
showPage('home');
})();
</script>

</body>
</html>
